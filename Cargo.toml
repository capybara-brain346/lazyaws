[package]
name = "lazyaws"
version = "0.1.0"
edition = "2024"
description = "A Lazygit-style terminal interface for AWS"
license = "MIT"

[dependencies]
crossterm = "0.29"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
serde_json = "1"

[profile.release]
lto = "thin"
strip = true
