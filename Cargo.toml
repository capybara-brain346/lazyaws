[package]
name = "lazyaws"
version = "0.1.2"
edition = "2024"
description = "A Lazygit-style terminal interface for AWS"
license = "MIT"
repository = "https://github.com/capybara-brain346/lazyaws"
homepage = "https://lazyaws.xyz"
readme = "README.md"
keywords = ["aws", "terminal", "tui"]
categories = ["command-line-utilities"]
include = ["/Cargo.toml", "/Cargo.lock", "/LICENSE", "/README.md", "/src/**", "/assets/themes.json", "/tests/ui.rs", "/tests/mouse.rs", "/tests/common/**", "/tests/fixtures/**"]

[dependencies]
crossterm = { version = "0.29", features = ["osc52"] }
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
serde_json = "1"

[profile.release]
lto = "thin"
strip = true
