name: Publish crate

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Validate the package or publish a stable crate release
        required: true
        type: choice
        options: [dry-run, publish]
        default: dry-run

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # actions/checkout v4.2.1
      - name: Install stable Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
      - name: Check tag for publish mode
        if: inputs.mode == 'publish'
        run: |
          version="$(node scripts/package-release.mjs --metadata | node -e 'let s=""; process.stdin.on("data", d => s += d).on("end", () => process.stdout.write(JSON.parse(s).version))')"
          test "$GITHUB_REF_TYPE" = tag
          test "$GITHUB_REF_NAME" = "v$version"
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
      - name: List package contents
        run: cargo package --list
      - name: Run locked publish dry run
        run: cargo publish --dry-run --locked

  publish:
    needs: check
    if: inputs.mode == 'publish'
    runs-on: ubuntu-24.04
    environment: crates.io
    permissions:
      contents: read
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # actions/checkout v4.2.1
      - name: Install stable Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
      - name: Check publication credential
        run: test -n "$CARGO_REGISTRY_TOKEN"
      - name: Publish
        run: cargo publish --locked
